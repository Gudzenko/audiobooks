x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ./audiobooks
      dockerfile: Dockerfile.prod
    volumes:
      - smoke_database:/app/data
      - smoke_media:/app/media
      - smoke_static:/app/prodstaticfiles
      - smoke_backups:/app/backups
    environment:
      SECRET_KEY: smoke-only-secret-key-with-more-than-fifty-characters-123456789
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web,nginx"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      DATABASE_PATH: /app/data/db.sqlite3
      FILE_UPLOAD_TEMP_DIR: /app/media/.upload_tmp
      TMPDIR: /app/media/.upload_tmp
      SMOKE_DATA_ENABLED: "True"
      TEST_ADMIN_EMAIL: smoke@example.com
      TEST_ADMIN_USERNAME: smoke
      TEST_ADMIN_PASSWORD: smoke
    command:
      - bash
      - -c
      - >-
        python manage.py migrate &&
        python manage.py seed_smoke_data &&
        exec uvicorn audiobooks.asgi:application --host 0.0.0.0 --port 8000
        --workers 2 --timeout-keep-alive 5 --limit-max-requests 1000
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - smoke_media:/app/media:ro
      - smoke_static:/app/prodstaticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

volumes:
  smoke_database:
  smoke_media:
  smoke_static:
  smoke_backups:
