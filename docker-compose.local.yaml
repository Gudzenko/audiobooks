services:
  web:
    build:
      context: ./audiobooks
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./audiobooks:/app
      - local_database:/app/localdata
      - local_media:/app/media
    environment:
      SECRET_KEY: local-development-only-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      DATABASE_PATH: /app/localdata/db.sqlite3
      FILE_UPLOAD_TEMP_DIR: /app/media/.upload_tmp
      TMPDIR: /app/media/.upload_tmp
      TEST_ADMIN_EMAIL: admin@example.com
      TEST_ADMIN_USERNAME: admin
      TEST_ADMIN_PASSWORD: admin
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-mock}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      EXA_API_KEY: ${EXA_API_KEY:-}
      CHAT_PROVIDER_TIMEOUT: ${CHAT_PROVIDER_TIMEOUT:-20}
      CHAT_WEB_RESULT_LIMIT: ${CHAT_WEB_RESULT_LIMIT:-4}
      CHAT_SITE_RESULT_LIMIT: ${CHAT_SITE_RESULT_LIMIT:-12}
      CHAT_CATALOG_RESULT_LIMIT: ${CHAT_CATALOG_RESULT_LIMIT:-200}
      CHAT_WEB_CONTENT_MAX_CHARS: ${CHAT_WEB_CONTENT_MAX_CHARS:-10000}
      CHAT_WEB_CONTENT_TOTAL_MAX_CHARS: ${CHAT_WEB_CONTENT_TOTAL_MAX_CHARS:-24000}
      CHAT_PLAN_MAX_OUTPUT_TOKENS: ${CHAT_PLAN_MAX_OUTPUT_TOKENS:-1200}
      CHAT_CLARIFICATION_MAX_OUTPUT_TOKENS: ${CHAT_CLARIFICATION_MAX_OUTPUT_TOKENS:-500}
      CHAT_ANSWER_MAX_OUTPUT_TOKENS: ${CHAT_ANSWER_MAX_OUTPUT_TOKENS:-1600}
      CHAT_LIST_MAX_OUTPUT_TOKENS: ${CHAT_LIST_MAX_OUTPUT_TOKENS:-6000}
      CHAT_TITLE_MATCH_MAX_OUTPUT_TOKENS: ${CHAT_TITLE_MATCH_MAX_OUTPUT_TOKENS:-3000}
      CHAT_REQUESTS_PER_MINUTE: ${CHAT_REQUESTS_PER_MINUTE:-10}
      CHAT_RATE_LIMIT_DIR: ${CHAT_RATE_LIMIT_DIR:-/tmp/audiobooks-chat-limits}
    command: >-
      bash -c "python manage.py migrate &&
      python manage.py seed_test_data &&
      uvicorn audiobooks.asgi:application --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  browser-tests:
    profiles: ["browser-tests"]
    build: ./browser-tests
    depends_on:
      browser-web:
        condition: service_healthy
    environment:
      BASE_URL: http://browser-web:8000
      TEST_ADMIN_USERNAME: admin
      TEST_ADMIN_PASSWORD: admin
    ipc: host
    volumes:
      - ./browser-tests/test-results:/tests/test-results

  browser-web:
    profiles: ["browser-tests"]
    build:
      context: ./audiobooks
      dockerfile: Dockerfile.dev
    volumes:
      - ./audiobooks:/app
      - browser_test_database:/app/browserdata
      - browser_test_media:/app/media
    environment:
      SECRET_KEY: browser-test-only-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: "browser-web"
      CSRF_TRUSTED_ORIGINS: "http://browser-web:8000"
      DATABASE_PATH: /app/browserdata/db.sqlite3
      FILE_UPLOAD_TEMP_DIR: /app/media/.upload_tmp
      TMPDIR: /app/media/.upload_tmp
      TEST_ADMIN_EMAIL: admin@example.com
      TEST_ADMIN_USERNAME: admin
      TEST_ADMIN_PASSWORD: admin
    command: >-
      bash -c "python manage.py migrate &&
      python manage.py seed_test_data &&
      uvicorn audiobooks.asgi:application --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  local_database:
  local_media:
  browser_test_database:
  browser_test_media:
