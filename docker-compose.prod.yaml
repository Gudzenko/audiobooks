x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: ./audiobooks
      dockerfile: Dockerfile.prod
    container_name: django_web
    restart: always
    volumes:
      - /media/pi/ADATA_HM900/media:/app/media
      #- ./audiobooks/media:/app/media
      - ./audiobooks/prodstaticfiles:/app/prodstaticfiles
      - ./audiobooks/db.sqlite3:/app/db.sqlite3
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      FILE_UPLOAD_TEMP_DIR: /app/media/.upload_tmp
      TMPDIR: /app/media/.upload_tmp
    init: true
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /media/pi/ADATA_HM900/media:/app/media:ro
      #- ./audiobooks/media:/app/media:ro
      - ./audiobooks/prodstaticfiles:/app/prodstaticfiles
    depends_on:
      web:
        condition: service_healthy
