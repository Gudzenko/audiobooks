{% extends 'store/base.html' %}
{% load static %}
{% load i18n %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'store/css/chat.css' %}?v=2">
{% endblock %}

{% block content %}
<section class="chat-shell" aria-labelledby="chat-title">
    <div class="chat-heading">
        <div>
            <h1 id="chat-title" class="h3 mb-1">{% trans "Library chat" %}</h1>
            <p class="text-muted mb-0">
                {% trans "Ask about the local catalog and compare it with web sources." %}
            </p>
        </div>
        <button id="clear-chat" class="btn btn-outline-secondary" type="button">
            {% trans "Clear" %}
        </button>
    </div>

    <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

    <form id="chat-form" class="chat-form"
          data-endpoint="{% url 'chat_message' %}"
          data-checking-message="{% trans 'Checking the local catalog…' %}"
          data-request-error="{% trans 'Chat request failed.' %}"
          data-cleared-message="{% trans 'The chat was cleared. Ask a new question.' %}"
          data-history-item-limit="{{ chat_history_item_limit }}"
          data-history-character-limit="{{ chat_history_character_limit }}">
        {% csrf_token %}
        <label for="chat-input" class="visually-hidden">{% trans "Message" %}</label>
        <textarea id="chat-input" class="form-control" rows="2" maxlength="4000"
                  placeholder="{% trans 'Type your question…' %}" required></textarea>
        <button id="chat-submit" class="btn chat-submit" type="submit">
            {% trans "Send" %}
        </button>
    </form>
</section>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'store/js/chat.js' %}?v=2"></script>
{% endblock %}
